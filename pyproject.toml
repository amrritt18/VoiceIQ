readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "huggingface-hub>=1.30.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "librosa>=0.11.0",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "soundfile>=0.14.0",
    "tensorflow>=2.21.0",
    "torch>=2.14.0",
    "torchcodec>=0.16.0",
]
